<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>실시간 이미지 보기</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black; /* 선택사항: 검은 배경 */
    }
    img {
      width: 100vw;  /* 뷰포트 너비 100% */
      height: 100vh; /* 뷰포트 높이 100% */
      object-fit: cover; /* 비율 유지하며 꽉 채움 */
      display: block;
    }
  </style>
</head>
<body>
  <img id="liveImage" src="image.jpg?ts=0" alt="실시간 이미지">

  <script>
    setInterval(() => {
      const img = document.getElementById('liveImage');
      const timestamp = new Date().getTime();
      img.src = `image.jpg?ts=${timestamp}`;
    }, 100);
  </script>
</body>
</html>
